    <script>
        const MAX_SELECTED = 5;
        const cards = document.querySelectorAll('.card');

        // Получить текущее количество выбранных карт
        function getSelectedCount() {
            return document.querySelectorAll('.card.selected').length;
        }

        // Получить массив data-id выбранных карт (удобно потом передавать в Python)
        function getSelectedIds() {
            return Array.from(document.querySelectorAll('.card.selected'))
                        .map(card => card.dataset.id);
        }

        cards.forEach(card => {
            card.addEventListener('click', () => {
                const isSelected = card.classList.contains('selected');

                if (isSelected) {
                    // Снять выделение
                    card.classList.remove('selected');
                } else {
                    // Добавить выделение, если не превышен лимит
                    if (getSelectedCount() < MAX_SELECTED) {
                        card.classList.add('selected');
                    } else {
                        // Можно заменить на свой toast / звук
                        console.log('Максимум 5 карт');
                        // card.style.animation = 'shake 0.3s'; // если захочешь тряску
                    }
                }

                // Для отладки / передачи в Eel
                console.log('Выбрано:', getSelectedIds());
            });
        });

        // Пример: функция, которую можно вызвать из Python через eel
