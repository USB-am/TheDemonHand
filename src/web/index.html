<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Demon's Hand - UI</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
    <div class="game-board">
        <div class="left-panel">
            <div class="deck"></div>
            <div class="token">2</div>
        </div>

        <div class="boss-card-wrapper">
            <div class="boss-card">
                <div class="boss-art"></div>
                <div class="boss-stats">
                    <span>24</span>
                    <span>174</span>
                </div>
            </div>
        </div>

        <div class="ui-buttons">
            <div class="ui-btn" title="Меню">⚙️</div>
            <div class="ui-btn" title="Сортировка">123</div>
        </div>

        <div class="combo">
            <p class="combo-title"></p>
            <p class="combo-damage"></p>
        </div>

        <div class="buttons">
            <button id="attack-btn">Attack</button>
            <button>Discard</button>
        </div>

        <div class="hand"></div>
    </div>

    <script>
        const MAX_HAND = 8;
        const MAX_SELECTED = 5;
        const cards = document.querySelectorAll('.card');

        function getCardsInHand() {
            return document.querySelectorAll('.card').length;
        }

        function createCard(id, value, suit, face_path) {
            let card = document.createElement('div');
            card.className = 'card';
            card.dataset.id = id;
            card.innerHTML = `
                <!-- <div class="card-art">${value}</div> -->
                <div class="card-value">${value} <span class="symbol">${suit}</span></div>
            `;
            Object.assign(card.style, {
                backgroundImage: `url(${face_path})`,
                backgroundSize: '100% 100%'
            });
            return card;
        }

        function handIsFilled() {
            return (!(getCardsInHand() < MAX_HAND));
        }

        async function take_card() {
            try {
                const taked_card = await eel.take_card()();
                // Если колода пуста – возвращаем false
                if (!taked_card) return false;

                const card = createCard(
                    taked_card.id,
                    taked_card.value,
                    taked_card.suit,
                    taked_card.face_path
                );
                card.addEventListener('click', () => {
                    const isSelected = card.classList.contains('selected');

                    if (isSelected) {
                        // Снять выделение
                        card.classList.remove('selected');
                    } else {
                        // Добавить выделение, если не превышен лимит
                        if (getSelectedCount() < MAX_SELECTED) {
                            card.classList.add('selected');
                        } else {
                            // Можно заменить на свой toast / звук
                            console.log('Максимум 5 карт');
                            // card.style.animation = 'shake 0.3s'; // если захочешь тряску
                        }
                    }

                    // Для отладки / передачи в Eel
                    console.log('Выбрано:', getSelectedIds());
                });
                document.querySelector('.hand').appendChild(card);
                return true;
            } catch (error) {
                console.error('Ошибка при взятии карты:', error);
                return false;
            }
        }

        async function fillHand() {
            while (getCardsInHand() < MAX_HAND) {
                const success = await take_card();
                if (!success) break;
            }
        }

        // Получить текущее количество выбранных карт
        function getSelectedCount() {
            return document.querySelectorAll('.card.selected').length;
        }

        function update_combo_information() {
            eel.get_combo_damage()(function (combo) {
                document.querySelector('.combo-title').innerHTML = combo.title;
                document.querySelector('.combo-damage').innerHTML = combo.damage;
            })
        }

        // Получить массив data-id выбранных карт (удобно потом передавать в Python)
        function getSelectedIds() {
            let card_ids = Array.from(document.querySelectorAll('.card.selected'))
                                .map(card => card.dataset.id);
            eel.update_selected_cards(card_ids);
            update_combo_information();
        }

        fillHand();

        document.querySelector('#attack-btn').addEventListener('click', () => {
            eel.attack()(function (damage) {
                console.log(damage);
            });
        });
    </script>
</body>
</html>
